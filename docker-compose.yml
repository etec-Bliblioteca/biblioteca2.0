services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: etecbiblioteca/biblioteca-app:1.0
    restart: always
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      INERTIA_SSR_URL: http://ssr:13714
    volumes:
      - ./:/var/www/html
      - app-vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
    networks:
      - sail
    depends_on:
      mysql:
        condition: service_healthy

  ssr:
    build:
      context: .
      dockerfile: Dockerfile.ssr
    working_dir: /var/www/html
    environment:
      NODE_ENV: production
      VITE_APP_NAME: "Biblioteca"
    networks:
      - sail
    ports:
      - "13714:13714"
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
    volumes:
      - sail-mysql:/var/lib/mysql
    networks:
      - sail
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 5
      interval: 5s
      timeout: 5s

  redis:
    image: redis:7
    networks:
      - sail
    ports:
      - "6379:6379"

  nginx:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sail

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
  app-vendor:
  storage:
