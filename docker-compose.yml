version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: etecbiblioteca/biblioteca-app:1.0
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BROADCAST_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INERTIA_SSR_URL: http://ssr:13714
    volumes:
      - ./resources:/var/www/html/resources
      - ./storage:/var/www/html/storage
      - ./public:/var/www/html/public
      - /var/www/html/vendor
      - /var/www/html/node_modules

    networks:
      - sail
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - sail-mysql:/var/lib/mysql
    networks:
      - sail
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 5
      interval: 5s
      timeout: 5s

  redis:
    image: redis:7
    networks:
      - sail
    ports:
      - "6379:6379"

  ssr:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: ["node", "resources/js/ssr.js"]
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    environment:
      NODE_ENV: production
    depends_on:
      - app
    networks:
      - sail
    ports:
      - "13714:13714"

  nginx:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sail

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
    driver: local
